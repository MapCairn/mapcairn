name: Secret scan

# Runs TruffleHog over the commits a pull request adds, and reports only findings it
# could verify as live. Verifying a candidate means TruffleHog sends it to the
# service that would have issued it (for example the provider's API), so a verified
# finding is a working credential. Nothing is sent to anyone else, and the job needs
# no secret and holds a read-only token, so it also runs on pull requests from forks.
#
# GitHub's own secret scanning and push protection stay on. This adds detectors
# GitHub's service does not run.
#
# The action runs TruffleHog from its container image, so the `version` input pins the
# image by tag and digest (the action's default is `latest`). The tag is the release the
# action's commit SHA is (the `# v...` comment on the `uses` line), so the scanner and the
# action it runs in stay one release; a test (`scannerPinsWorkflows.test.ts`) fails when
# they differ. Dependabot bumps the action's commit SHA but not this input, so when it
# does, set the tag to the same release and the digest to the one the registry returns
# for that tag (`ghcr.io/trufflesecurity/trufflehog`), and use a release at least three
# days old.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request:
    name: TruffleHog (pull request)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The scan needs the base commit and every commit up to the head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the pull request's commits
        uses: trufflesecurity/trufflehog@4ef51f69ca6347aaa76a5e64a87eac9c0c909f71 # v3.100.1
        with:
          version: 3.100.1@sha256:9c7a8325d43a4af2960d3f21d61a08981d8a1bf0542e007efa2e47097e386452
          extra_args: --results=verified
