name: Secret scan

# Runs TruffleHog over the commits a pull request adds, and reports only findings it
# could verify as live. Verifying a candidate means TruffleHog sends it to the
# service that would have issued it (for example the provider's API), so a verified
# finding is a working credential. Nothing is sent to anyone else, and the job needs
# no secret and holds a read-only token, so it also runs on pull requests from forks.
#
# GitHub's own secret scanning and push protection stay on. This adds detectors
# GitHub's service does not run.
#
# The action runs TruffleHog from its container image, so the version is pinned here
# (the action's default is `latest`). Update it together with the action.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request:
    name: TruffleHog (pull request)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The scan needs the base commit and every commit up to the head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the pull request's commits
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          version: 3.99.8
          extra_args: --results=verified
