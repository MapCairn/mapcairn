name: Release

# A run is named by its mode and version, so that an approval in the list of
# pending deployments is read as a publish. Only a real publish ever waits for
# one: the dry run of a rehearsal is in the `rehearse` job, which has no
# environment and no OIDC token. The mode is a constrained choice and `decide`
# validates the version; the name is display only.
run-name: Release ${{ inputs.mode || 'publish' }} ${{ inputs.version || github.sha }}

# Releases the SDK packages (plan 0014, docs/guides/releasing.md). One
# workflow, four jobs, and one environment (`npm`). npm's trusted-publisher
# record names this file and that environment, so neither is renamed without
# updating the record.
#
# A release starts only from a maintainer's action: merging a Release pull
# request (title `chore(release): v<version>`, label `release`), or starting
# this workflow by hand. The `npm` job then publishes the packages
# directly through npm trusted publishing (OIDC, no stored token), once a
# required reviewer of the `npm` environment has approved the deployment. No
# other merge to main tags, releases or publishes anything.
#
# Inputs and pull request text reach scripts through `env`, never through an
# expression in a shell line, and `scripts/release/verifyRelease.mjs` checks
# the version input against a pattern before anything else uses it.
#
# The tarballs are packed once, in `verify`, and uploaded at once. Their
# SHA-256 digests leave `verify` as a job output. The `check` job runs
# third-party code (the throwaway consumer installs from the registry). It has
# no GITHUB_TOKEN permission and only reads a copy of the artifact, but the
# runner's artifact token stays in every job, so the digests, not the
# permissions, are what protect the release: `github-release` and `npm`
# compare what they download with the recorded digests before they attest or
# publish. So what was checked is what is released.
#
# The runner's cache token is limited by `cache-mode: none` below, so no job
# here can save an Actions cache entry or restore one (issue 515). A cache is
# scoped by branch, not by workflow or job, and the code that saves an entry
# picks its key, so a separate key or workflow would not keep `check` from
# poisoning the entries the CI, browser and Lighthouse jobs restore on main.
# This workflow cannot run on a pull request's own ref either, because a release
# starts only from main. The mode limits the token itself, which is the control
# that closes the path; docs/guides/releasing.md has the reasoning.
on:
  push:
    branches: [main]
    paths:
      - CHANGELOG.md
  workflow_dispatch:
    inputs:
      version:
        description: The version to rehearse or publish, such as 0.1.0 or 0.1.0-rc.1 (no leading v)
        required: true
        type: string
      mode:
        description: >-
          rehearse runs the checks and a dry run of the publishing, and tags and
          releases nothing. publish-existing publishes the tarballs of a GitHub
          Release that is already tagged (maintainer only).
        required: true
        type: choice
        default: rehearse
        options:
          - rehearse
          - publish-existing

permissions: {}

cache-mode: none

# A dispatched run never overlaps another run of the same version, and a push
# run is keyed by its commit. The npm job has its own group per version (below),
# so a push run and a dispatched run never publish one version at once. Nothing
# that has started is cancelled: a half-finished release is worse than a
# waiting one. GitHub does cancel a job that is still pending in a group when a
# newer one queues behind it.
concurrency:
  group: release-${{ inputs.version || github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # check out the repository
      pull-requests: read # read the merged Release pull request and its label
      attestations: read # verify the attestations of an existing release's tarballs
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
      prerelease: ${{ steps.decide.outputs.prerelease }}
      dist-tag: ${{ steps.decide.outputs.dist-tag }}
      private: ${{ steps.decide.outputs.private }}
      digests: ${{ steps.record.outputs.digests }}
      notes-digest: ${{ steps.record.outputs.notes-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The notes check reads the history, and the tag check reads the tags.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          # No cache in a release build.
          package-manager-cache: false

      - name: Decide whether there is something to release
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          VERSION_INPUT: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/verifyRelease.mjs decide

      - name: Download the release's tarballs
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish-existing'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release download "v$VERSION" --repo MapCairn/mapcairn --pattern '*.tgz' --dir release
      - name: Verify the attestation of each tarball and the version it holds
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'publish-existing'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          commit="$(git rev-parse "v$VERSION^{commit}")"
          git merge-base --is-ancestor "$commit" HEAD
          for tarball in release/*.tgz; do
            gh attestation verify "$tarball" --repo MapCairn/mapcairn --signer-workflow MapCairn/mapcairn/.github/workflows/release.yml --source-ref refs/heads/main --source-digest "$commit" --deny-self-hosted-runners
          done
          node scripts/release/verifyRelease.mjs tarballs "$VERSION" release

      - name: Install the dependencies
        if: steps.decide.outputs.release == 'true' && inputs.mode != 'publish-existing'
        run: npm ci --ignore-scripts
      - name: Build the packages
        if: steps.decide.outputs.release == 'true' && inputs.mode != 'publish-existing'
        run: npm run build:sdk
      - name: Pack the tarballs once
        if: steps.decide.outputs.release == 'true' && inputs.mode != 'publish-existing'
        run: node scripts/release/tarballs.mjs pack release
      - name: Check the release notes
        if: steps.decide.outputs.release == 'true' && inputs.mode != 'publish-existing'
        run: npm run release:notes-check
      - name: Write the release notes
        if: github.event_name == 'push' && steps.decide.outputs.release == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        shell: bash
        run: node scripts/release/notes.mjs "$VERSION" > release/notes.md
      - name: Record the digests of the tarballs and the notes
        id: record
        if: steps.decide.outputs.release == 'true'
        run: node scripts/release/tarballs.mjs record release
      - name: Keep the tarballs and the notes for the later jobs
        if: steps.decide.outputs.release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release/
          if-no-files-found: error
          retention-days: 14

  check:
    name: check
    needs: verify
    if: >-
      github.ref == 'refs/heads/main'
      && needs.verify.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No GITHUB_TOKEN permission: this job runs third-party code and only
    # reads a copy of the artifact. The runner's artifact token remains, so the
    # recorded digests, not these permissions, protect the release. The
    # workflow's `cache-mode: none` takes the cache token away from it.
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release
      - name: Check the files are the ones that were packed
        env:
          DIGESTS: ${{ needs.verify.outputs.digests }}
          NOTES_DIGEST: ${{ needs.verify.outputs.notes-digest }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          node scripts/release/tarballs.mjs check release "$DIGESTS" "$NOTES_DIGEST"
          node scripts/release/verifyRelease.mjs tarballs "$VERSION" release
      - name: Check what each tarball holds
        if: inputs.mode != 'publish-existing'
        run: node scripts/release/packCheck.mjs --tarballs release
      - name: Install the tarballs in an app outside the repository and render the chrome
        if: inputs.mode != 'publish-existing'
        run: node scripts/release/consumerCheck.mjs --tarballs release

  github-release:
    name: github-release
    needs: [verify, check]
    if: >-
      github.ref == 'refs/heads/main'
      && github.event_name == 'push'
      && needs.verify.outputs.release == 'true'
      && needs.check.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the tag and the GitHub Release
      id-token: write # sign the attestations of the tarballs
      attestations: write # store the attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release
      - name: Check the files are the ones that were packed, and are exactly the expected tarballs
        env:
          DIGESTS: ${{ needs.verify.outputs.digests }}
          NOTES_DIGEST: ${{ needs.verify.outputs.notes-digest }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          node scripts/release/tarballs.mjs check-release release "$DIGESTS" "$NOTES_DIGEST"
          node scripts/release/verifyRelease.mjs tarballs "$VERSION" release
      - name: Attest the tarballs
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.tgz
      - name: Create the tag and the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          TARGET: ${{ github.sha }}
        shell: bash
        # The tag is created at the commit that was pushed, through the API,
        # which refuses a tag that exists. A re-run of the failed jobs after a
        # failed release step continues only when the tag is already at this
        # commit.
        run: |
          if ! gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$TARGET"; then
            existing="$(gh api "repos/$GH_REPO/git/ref/tags/v$VERSION" --jq .object.sha)"
            if [ "$existing" != "$TARGET" ]; then
              echo "The tag v$VERSION exists at $existing, not at $TARGET." >&2
              exit 1
            fi
          fi
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "v$VERSION" release/*.tgz --verify-tag --title "v$VERSION" --notes-file release/notes.md "${flags[@]}"

  rehearse:
    name: rehearse
    needs: [verify, check]
    # The dry run of a rehearsal. No environment and no id-token: nothing here
    # can wait for an approval or publish, so the only deployment a reviewer is
    # ever asked to approve is a real publish.
    if: >-
      github.ref == 'refs/heads/main'
      && needs.verify.result == 'success' && needs.verify.outputs.release == 'true'
      && needs.check.result == 'success'
      && inputs.mode == 'rehearse'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release
      - name: Check the files are the ones that were packed, and hold the tarballs of this version
        env:
          DIGESTS: ${{ needs.verify.outputs.digests }}
          NOTES_DIGEST: ${{ needs.verify.outputs.notes-digest }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          node scripts/release/tarballs.mjs check release "$DIGESTS" "$NOTES_DIGEST"
          node scripts/release/verifyRelease.mjs tarballs "$VERSION" release

      - name: Use an npm that supports trusted publishing
        shell: bash
        # Trusted publishing needs npm 11.5.1 or later. The version installed
        # when the runner's npm is older is the one the repository's
        # packageManager field pins.
        run: | # zizmor: ignore[adhoc-packages]
          required=11.5.1
          current="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$required" "$current" | sort -V | head -n 1)" != "$required" ]; then
            wanted="$(node -p "require('./package.json').packageManager.replace('npm@', '')")"
            npm install --global --ignore-scripts "npm@$wanted"
          fi
          npm --version

      - name: Say why nothing is dry-run while the packages are private
        if: needs.verify.outputs.private == 'true'
        run: echo "::notice::An SDK manifest still sets private, so npm would skip it. Nothing is dry-run; the rc.1 Release pull request removes private."
      - name: Dry-run the publishing
        if: needs.verify.outputs.private != 'true'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
        shell: bash
        # The same loop as the `npm` job, with --dry-run and no read-back. A
        # package whose version is on npm is skipped with a notice. A package
        # npm does not have at all is reported with a warning, which is where
        # the real run would stop; it is not dry-run, and the rehearsal does
        # not fail, so the rest is still proved. npm tries no OIDC exchange
        # here (no token), so this proves the tarball, the tag and the version
        # rules, and nothing about trusted publishing.
        run: |
          for name in core react theme map adapter-maplibre sdk; do
            state="$(node scripts/release/verifyRelease.mjs package-state "@mapcairn/$name" "$VERSION")"
            if [ "$state" = "published" ]; then
              echo "::notice::@mapcairn/$name@$VERSION is already on npm, so it is skipped."
              continue
            fi
            if [ "$state" = "new" ]; then
              echo "::warning::@mapcairn/$name is not on npm yet. A real run publishes the other packages and then fails on this one: its first upload is by hand (docs/guides/releasing.md, A package npm does not have yet)."
              continue
            fi
            npm publish "$GITHUB_WORKSPACE/release/mapcairn-$name-$VERSION.tgz" --ignore-scripts --tag "$DIST_TAG" --provenance --dry-run
          done

  npm:
    name: npm
    needs: [verify, check, github-release]
    # A job whose needs include a skipped job is skipped too, unless the
    # condition says otherwise: here a skipped github-release is fine, since a
    # publish-existing run never creates a release.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main'
      && needs.verify.result == 'success' && needs.verify.outputs.release == 'true'
      && needs.check.result == 'success'
      && contains(fromJSON('["success","skipped"]'), needs.github-release.result)
      && inputs.mode != 'rehearse'
    environment: npm
    concurrency:
      group: release-npm-${{ needs.verify.outputs.version }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Every package waits up to about 10 minutes for the registry after its
    # publish (CONFIRM_DELAYS_MS in verifyRelease.mjs), six packages in a row,
    # plus setup.
    timeout-minutes: 75
    permissions:
      id-token: write # trusted publishing: npm exchanges this run's OIDC token for a short-lived credential, so no secret is stored
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release
      - name: Check the files are the ones that were packed, and hold the tarballs of this version
        env:
          DIGESTS: ${{ needs.verify.outputs.digests }}
          NOTES_DIGEST: ${{ needs.verify.outputs.notes-digest }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          node scripts/release/tarballs.mjs check release "$DIGESTS" "$NOTES_DIGEST"
          node scripts/release/verifyRelease.mjs tarballs "$VERSION" release

      - name: Use an npm that supports trusted publishing
        shell: bash
        # Trusted publishing needs npm 11.5.1 or later. The version installed
        # when the runner's npm is older is the one the repository's
        # packageManager field pins.
        run: | # zizmor: ignore[adhoc-packages]
          required=11.5.1
          current="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$required" "$current" | sort -V | head -n 1)" != "$required" ]; then
            wanted="$(node -p "require('./package.json').packageManager.replace('npm@', '')")"
            npm install --global --ignore-scripts "npm@$wanted"
          fi
          npm --version

      - name: Say why nothing is published while the packages are private
        if: needs.verify.outputs.private == 'true'
        run: echo "::notice::An SDK manifest still sets private, so npm would skip it. Nothing is published; the rc.1 Release pull request removes private."
      - name: Publish the packages
        if: needs.verify.outputs.private != 'true'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
        shell: bash
        # No token and no registry-url: npm exchanges this job's OIDC token
        # for a short-lived credential, and records provenance. --provenance
        # is explicit so that a publish that could not get provenance fails
        # before the upload, which cannot be undone. A package whose version
        # is on npm is skipped with a notice; one whose version is not
        # found is published; any other registry answer stops the job. After each
        # publish the registry is read back, and the job fails if the version
        # does not appear. A re-run of the failed jobs after a partial publish
        # therefore skips what is on npm and publishes the rest
        # (docs/guides/releasing.md). A package npm does not have at all
        # cannot be published here, because a package gets its trusted
        # publisher only after its first publish: it is left, the others are
        # handled, and the job then fails naming it, so the run is red until
        # the first upload is done by hand and the failed jobs are re-run. Every
        # state is read before anything is published, and nothing is published
        # when a package that is not on npm is a dependency of one that would be.
        # The dependencies are read into a variable first, so that a read that
        # fails stops the job instead of reading as no dependencies.
        run: |
          first_uploads=()
          to_publish=()
          for name in core react theme map adapter-maplibre sdk; do
            state="$(node scripts/release/verifyRelease.mjs package-state "@mapcairn/$name" "$VERSION")"
            if [ "$state" = "published" ]; then
              echo "::notice::@mapcairn/$name@$VERSION is already on npm, so it is skipped."
              continue
            fi
            if [ "$state" = "new" ]; then
              first_uploads+=("@mapcairn/$name")
              echo "::error::@mapcairn/$name is not on npm yet, so trusted publishing cannot publish it: a package gets its trusted publisher only after its first upload. Publish it by hand from the release's attested tarball, signed in with two-factor authentication, then use Re-run failed jobs, and link its trusted publisher when the next Release pull request is ready (docs/guides/releasing.md, A package npm does not have yet)."
              continue
            fi
            to_publish+=("$name")
          done
          blocked=0
          for name in "${to_publish[@]}"; do
            dependencies="$(node scripts/release/verifyRelease.mjs dependencies "@mapcairn/$name" "$VERSION" release)"
            for dependency in $dependencies; do
              for package in "${first_uploads[@]}"; do
                if [ "$dependency" = "$package" ]; then
                  echo "::error::@mapcairn/$name depends on $package, which is not on npm yet, so publishing it now would leave a version nobody can install. Nothing was published. Upload $package by hand first, then use Re-run failed jobs (docs/guides/releasing.md, A package npm does not have yet)."
                  blocked=1
                fi
              done
            done
          done
          if [ "$blocked" = "1" ]; then
            exit 1
          fi
          for name in "${to_publish[@]}"; do
            npm publish "$GITHUB_WORKSPACE/release/mapcairn-$name-$VERSION.tgz" --ignore-scripts --tag "$DIST_TAG" --provenance
            node scripts/release/verifyRelease.mjs confirm-published "@mapcairn/$name" "$VERSION"
          done
          if [ "${#first_uploads[@]}" -gt 0 ]; then
            exit 1
          fi
