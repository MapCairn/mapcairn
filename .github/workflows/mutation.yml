name: Mutation testing

# Runs Stryker on a slice of `packages/core` (the URL hash and measurement
# logic, see stryker.config.mjs) weekly and on request. It reports only: the
# score table goes to the job summary and the full report to an artifact, and a
# surviving mutant never fails the run or blocks a change.
on:
  schedule:
    - cron: "37 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    name: mutation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run mutation tests
        run: npm run test:mutation | tee "${RUNNER_TEMP}/mutation.txt"

      - name: Write the score to the job summary
        if: always()
        run: |
          {
            echo "### Mutation score"
            echo '```'
            sed -n '/% Mutation score/,$p' "${RUNNER_TEMP}/mutation.txt" | sed -e 's/\x1b\[[0-9;]*m//g'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report
          path: reports/mutation
          if-no-files-found: ignore
