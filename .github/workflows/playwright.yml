name: Playwright E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The suite runs on one worker per job: the `wrangler dev` server behind the
  # tests crashes under parallel load (see workers in packages/web/playwright.config.ts).
  # Sharding gets the speed back by giving each shard its own runner and server.
  shard:
    name: e2e shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install dependencies
        run: |
          npm ci

      # The runner's Ubuntu mirror is sometimes very slow, so apt gives up on a
      # stalled download and retries it, rather than the whole step hanging.
      - name: Make apt downloads fail fast and retry
        run: |
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/80-ci-retries >/dev/null

      # WebKit pulls in about 185 system packages (gstreamer, libav), and only
      # the shard that holds the WebKit tests needs them.
      - name: Install Playwright browsers
        working-directory: packages/web
        timeout-minutes: 15
        run: |
          if npx --no-install playwright test --list --shard=${{ matrix.shard }}/4 | grep -q '\[webkit\]'; then
            browsers="chromium webkit"
          else
            browsers="chromium"
          fi
          npx --no-install playwright install --with-deps ${browsers}

      - name: Run Playwright tests (shard ${{ matrix.shard }} of 4)
        run: npm run test:e2e:all -w @mapcairn/web -- --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: packages/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: packages/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The required check on `main` is named `e2e`, so this job keeps that name and
  # passes only when every shard passed.
  e2e:
    name: e2e
    needs: shard
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.shard.result }}
        run: |
          echo "Shard result: $SHARDS"
          test "$SHARDS" = "success"
