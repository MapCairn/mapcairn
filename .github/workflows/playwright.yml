name: Playwright E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The shards run in Playwright's own image, whose tag has to match the
  # installed @playwright/test, so the version is read from the lockfile once.
  playwright-version:
    name: playwright version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the Playwright version from the lockfile
        id: read
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  # The suite runs on one worker per job: the `wrangler dev` server behind the
  # tests crashes under parallel load (see workers in packages/web/playwright.config.ts).
  # Sharding gets the speed back by giving each shard its own runner and server.
  shard:
    name: e2e shard ${{ matrix.shard }}
    needs: playwright-version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The image carries the browsers and their system packages, so the job no
    # longer downloads them from Ubuntu's mirrors, which are unreliable from the runners.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --init --ipc=host
    env:
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      # The checkout belongs to another user inside the container, and git refuses
      # it until it is trusted; the `prepare` script (lefthook install) needs git.
      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: |
          npm ci

      - name: Run Playwright tests (shard ${{ matrix.shard }} of 4)
        run: npm run test:e2e -w @mapcairn/web -- --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: packages/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: packages/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The required check on `main` is named `e2e`, so this job keeps that name and
  # passes only when every shard passed.
  e2e:
    name: e2e
    needs: shard
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.shard.result }}
        run: |
          echo "Shard result: $SHARDS"
          test "$SHARDS" = "success"
