name: Repeatable build

# Builds the site twice from a clean state and compares every output file.
# It runs weekly and on request, not on pull requests, so a difference never
# blocks a change; it fails the run so the difference is seen and fixed.
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: First build
        run: npm run build

      - name: Hash the first build
        run: |
          cd packages/web/build
          find . -type f -print0 | sort -z | xargs -0 sha256sum > "${RUNNER_TEMP}/first.sha256"

      - name: Second build from clean
        run: |
          rm -rf packages/web/build
          npm run build

      - name: Hash the second build
        run: |
          cd packages/web/build
          find . -type f -print0 | sort -z | xargs -0 sha256sum > "${RUNNER_TEMP}/second.sha256"

      - name: Compare the two builds
        run: |
          if diff -u "${RUNNER_TEMP}/first.sha256" "${RUNNER_TEMP}/second.sha256"; then
            echo "Both builds are byte for byte identical ($(wc -l < "${RUNNER_TEMP}/first.sha256") files)."
          else
            echo "::error::The two builds differ."
            exit 1
          fi
