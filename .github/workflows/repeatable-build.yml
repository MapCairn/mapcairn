name: Repeatable build

# Builds the site and the SDK packages twice from a clean state and
# compares every output file, the SDK `dist` folders and the packed tarballs.
# It runs weekly and on request, not on pull requests, so a difference never
# blocks a change; it fails the run so the difference is seen and fixed.
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repeatable-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: compare
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: First build
        run: npm run build -w @mapcairn/web

      - name: Hash the first build
        run: |
          (cd packages/web/.cloudflare/output && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "${RUNNER_TEMP}/first.sha256"
          for package in core react theme map adapter-maplibre sdk; do
            find "packages/${package}/dist" -type f -print0 | sort -z | xargs -0 sha256sum >> "${RUNNER_TEMP}/first.sha256"
          done
          mkdir "${RUNNER_TEMP}/first-tarballs"
          for package in core react theme map adapter-maplibre sdk; do
            npm pack --ignore-scripts --workspace "packages/${package}" --pack-destination "${RUNNER_TEMP}/first-tarballs"
          done
          (cd "${RUNNER_TEMP}/first-tarballs" && sha256sum -- *.tgz) >> "${RUNNER_TEMP}/first.sha256"

      - name: Second build from clean
        run: |
          # The SDK packages skip a build their stamp says is current, so their
          # `dist` folders go too, or this would compare a build with itself.
          rm -rf packages/web/.cloudflare
          for package in core react theme map adapter-maplibre sdk; do
            rm -rf "packages/${package}/dist"
          done
          npm run build -w @mapcairn/web

      - name: Hash the second build
        run: |
          (cd packages/web/.cloudflare/output && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "${RUNNER_TEMP}/second.sha256"
          for package in core react theme map adapter-maplibre sdk; do
            find "packages/${package}/dist" -type f -print0 | sort -z | xargs -0 sha256sum >> "${RUNNER_TEMP}/second.sha256"
          done
          mkdir "${RUNNER_TEMP}/second-tarballs"
          for package in core react theme map adapter-maplibre sdk; do
            npm pack --ignore-scripts --workspace "packages/${package}" --pack-destination "${RUNNER_TEMP}/second-tarballs"
          done
          (cd "${RUNNER_TEMP}/second-tarballs" && sha256sum -- *.tgz) >> "${RUNNER_TEMP}/second.sha256"

      - name: Compare the two builds, the SDK dist folders and the tarballs
        run: |
          if diff -u "${RUNNER_TEMP}/first.sha256" "${RUNNER_TEMP}/second.sha256"; then
            echo "Both builds, the SDK dist folders and the tarballs are byte for byte identical ($(wc -l < "${RUNNER_TEMP}/first.sha256") files)."
          else
            echo "::error::The two builds differ."
            exit 1
          fi
