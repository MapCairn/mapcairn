name: CI

on:
  pull_request:
    # `edited` runs the names check again when the title or description changes.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

# A new push cancels the run for the older commit, but a title or description
# edit has a group of its own: it would otherwise cancel the run in progress for
# the same commit, and its own run skips the SDK packages job, so that check
# would be lost until the next push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ github.event.action == 'edited' && '-edited' || '' }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The names check reads the pull request's commit messages, which
          # needs the base branch's history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
        env:
          # The roadmap check reads issue states and milestones with `gh`, which
          # needs a token even for a public repository. Without one it skips
          # those parts.
          GH_TOKEN: ${{ github.token }}
      - name: Check the pull request text and commit messages for forbidden names
        if: github.event_name == 'pull_request'
        # The title, body and base branch reach the script through the
        # environment, never through the shell script text.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        # `shell: bash` turns on pipefail, so a failing `git log` fails the step.
        shell: bash
        run: git log --format=%B "origin/$BASE_REF..HEAD" | node scripts/names-check.mjs text
      - name: Check that a breaking API change is marked in the pull request title
        if: github.event_name == 'pull_request'
        # Reads the API reports at the merge base and at HEAD, which needs the
        # full history fetched above. The title, description and base branch
        # reach the script through the environment, never through the shell
        # script text. Release and Dependabot pull requests are skipped inside it.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/apiBreakingCheck.mjs
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
      - run: npm run build
      # The documentation site has its own build step, outside the root `build`
      # script, so a fault in it cannot stop the host's production deploy, which
      # runs that script. It fails on a broken link, a page in no sidebar, a
      # policy break or a script over budget (`sites/docs/scripts/verifyBuild.ts`).
      - name: Build the documentation site
        run: npm run build -w @mapcairn/docs
      # The build is up to date here, so this only reads its declarations. It
      # fails when a package's public API changed and its report under
      # `packages/*/api` was not updated, and prints the TSDoc warnings
      # without failing on them.
      - name: Check the API reports
        run: npm run api:check -- --verbose
      # The coverage run above comes before the build, so the tests that read
      # the build output skip there. Run them here, against it. The variable
      # makes inlineScriptsBuild.test.ts fail, not skip, if the output is missing.
      - run: npx --no-install vitest run packages/web/src/workerBundle.test.ts packages/web/src/deployConfig.test.ts packages/web/src/inlineScriptsBuild.test.ts
        env:
          MAPCAIRN_REQUIRE_BUILD_OUTPUT: "1"

  # Its own job, so a registry outage or a package that publishes without a
  # signature cannot fail the required `build` check. Nothing depends on it.
  signatures:
    name: Registry signatures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      # Checks the registry signature of every installed package and the
      # provenance attestation of those that have one.
      - run: npm audit signatures

  # Packs the SDK packages and proves the tarballs hold only what they
  # should and work in an app outside this repository (`npm run pack:check` and
  # `npm run consumer:check`, plan 0014 step 6). It is a required check on `main`
  # (ruleset `main-pull-requests`), though it installs from the registry.
  # The release workflow's `check` job installs nothing and so never draws the
  # real map; running this check with Chromium is a go/no-go item of the
  # `release` skill. `paths` filters a whole workflow, not a job, so the first
  # step decides whether the rest run.
  sdk-packages:
    name: SDK packages
    # `edited` is in the triggers for the names check; a new title or
    # description changes nothing here, so the networked job does not run again.
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # This job installs from the registry and runs what it finds, and on a push
    # to main it holds a main-scoped cache token. Read-only access lets it
    # restore the lockfile cache for speed but not save an entry that the other
    # jobs on main would restore (issue 515; docs/guides/releasing.md).
    cache-mode: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find out whether the SDK packages or the release scripts changed
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        # `shell: bash` turns on errexit and pipefail. The diff is assigned on
        # its own line, so a failing `git diff` fails the step, and grep reads
        # a here-string, so there is no pipe to close early (status 141).
        shell: bash
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          if grep -Eq '^(packages/(adapter-maplibre|core|map|react|theme|sdk)/|scripts/(release/|buildPackage\.mjs|buildSdk\.mjs|entryPoint\.mjs)|package(-lock)?\.json|tsconfig\.base\.json|\.npmrc|\.github/workflows/ci\.yml)' <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No SDK package, release script or lockfile changed, so the pack and consumer checks are skipped."
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - if: steps.changed.outputs.run == 'true'
        run: npm ci --ignore-scripts
      # The consumer check's Bun leg runs only when `bun` is on the path.
      # Bun 1.3 or later reads the minimum release age; 1.4.4 was
      # published 2026-10-22. The action is pinned by commit, as the others are.
      - name: Install Bun for the consumer check's Bun leg
        if: steps.changed.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Check what each tarball holds
        if: steps.changed.outputs.run == 'true'
        run: npm run pack:check
      # The repository's own Playwright, as the lockfile pins it. The leg that
      # draws a real map fails, rather than skips, when this browser is missing.
      - name: Install Chromium for the consumer check's real-map leg
        if: steps.changed.outputs.run == 'true'
        run: npx --no-install playwright install --with-deps chromium
      - name: Install the tarballs in an app outside the repository, render the chrome and draw a real map
        if: steps.changed.outputs.run == 'true'
        run: npm run consumer:check
