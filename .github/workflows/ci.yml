name: CI

on:
  pull_request:
    # `edited` runs the names check again when the title or description changes.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The names check reads the pull request's commit messages, which
          # needs the base branch's history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
        env:
          # The roadmap check reads issue states and milestones with `gh`, which
          # needs a token even for a public repository. Without one it skips
          # those parts.
          GH_TOKEN: ${{ github.token }}
      - name: Check the pull request text and commit messages for forbidden names
        if: github.event_name == 'pull_request'
        # The title, body and base branch reach the script through the
        # environment, never through the shell script text.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        # `shell: bash` turns on pipefail, so a failing `git log` fails the step.
        shell: bash
        run: git log --format=%B "origin/$BASE_REF..HEAD" | node scripts/names-check.mjs text
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
      - run: npm run build

  # Its own job, so a registry outage or a package that publishes without a
  # signature cannot fail the required `build` check. Nothing depends on it.
  signatures:
    name: Registry signatures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      # Checks the registry signature of every installed package and the
      # provenance attestation of those that have one.
      - run: npm audit signatures

  # Builds geolint, packs it, installs the tarball in a directory outside the
  # repository and runs the command there, to prove the package works on its own.
  # It runs only when geolint, the shared tsconfig.base.json, the lockfile or this
  # workflow changed in the pull request (always on a push to main). The filter is
  # a step inside the job, not a `paths` filter on the workflow, so the required
  # `build` and `e2e` checks always report. Nothing depends on it and it is not a
  # required check.
  geolint-pack:
    name: geolint pack and install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find out whether geolint changed
        id: changed
        # The event name and base branch reach the script through the
        # environment, never through the shell script text.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "origin/$BASE_REF...HEAD" -- packages/geolint tsconfig.base.json package-lock.json .github/workflows/ci.yml; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - if: steps.changed.outputs.run == 'true'
        run: npm ci --ignore-scripts
      - if: steps.changed.outputs.run == 'true'
        run: npm run smoke -w @mapcairn/geolint
