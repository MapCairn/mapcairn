name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@11
      - run: npm ci
      - name: Verify compiled Paraglide messages are up to date
        run: |
          npm run messages:compile -w @karta/web
          git diff --exit-code -- packages/web/src/paraglide || {
            echo "::error::packages/web/src/paraglide is out of date. Run 'npm run messages:compile -w @karta/web' and commit the result.";
            exit 1;
          }
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
      - run: npm run build
