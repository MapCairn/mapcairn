name: CI

on:
  pull_request:
    # `edited` runs the names check again when the title or description changes.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The names check reads the pull request's commit messages, which
          # needs the base branch's history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
        env:
          # The roadmap check reads issue states and milestones with `gh`, which
          # needs a token even for a public repository. Without one it skips
          # those parts.
          GH_TOKEN: ${{ github.token }}
      - name: Check the pull request text and commit messages for forbidden names
        if: github.event_name == 'pull_request'
        # The title, body and base branch reach the script through the
        # environment, never through the shell script text.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        # `shell: bash` turns on pipefail, so a failing `git log` fails the step.
        shell: bash
        run: git log --format=%B "origin/$BASE_REF..HEAD" | node scripts/names-check.mjs text
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
      - run: npm run build
      # The build is up to date here, so this only reads its declarations. It
      # fails when a package's public API changed and its report under
      # `packages/*/api` was not updated, and prints the TSDoc warnings
      # without failing on them.
      - name: Check the API reports
        run: npm run api:check -- --verbose
      # The coverage run above comes before the build, so the tests that read
      # the build output skip there. Run them here, against it.
      - run: npx --no-install vitest run packages/web/src/workerBundle.test.ts packages/web/src/deployConfig.test.ts

  # Its own job, so a registry outage or a package that publishes without a
  # signature cannot fail the required `build` check. Nothing depends on it.
  signatures:
    name: Registry signatures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      # Checks the registry signature of every installed package and the
      # provenance attestation of those that have one.
      - run: npm audit signatures

  # Packs the four SDK packages and proves the tarballs hold only what they
  # should and work in an app outside this repository (`npm run pack:check` and
  # `npm run consumer:check`, plan 0014 step 6). It is not a required check: it
  # installs from the registry, so a registry outage must not block a merge.
  # The release workflow's verify job will require it. `paths` filters a whole
  # workflow, not a job, so the first step decides whether the rest run.
  sdk-packages:
    name: SDK packages
    # `edited` is in the triggers for the names check; a new title or
    # description changes nothing here, so the networked job does not run again.
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find out whether the SDK packages or the release scripts changed
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        # `shell: bash` turns on errexit and pipefail. The diff is assigned on
        # its own line, so a failing `git diff` fails the step, and grep reads
        # a here-string, so there is no pipe to close early (status 141).
        shell: bash
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          if grep -Eq '^(packages/(core|map|react|theme)/|scripts/(release/|buildPackage\.mjs|buildSdk\.mjs|entryPoint\.mjs)|package(-lock)?\.json|tsconfig\.base\.json|\.npmrc|\.github/workflows/ci\.yml)' <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No SDK package, release script or lockfile changed, so the pack and consumer checks are skipped."
          fi
      - if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - if: steps.changed.outputs.run == 'true'
        run: npm ci --ignore-scripts
      - name: Check what each tarball holds
        if: steps.changed.outputs.run == 'true'
        run: npm run pack:check
      - name: Install the tarballs in an app outside the repository and render the chrome
        if: steps.changed.outputs.run == 'true'
        run: npm run consumer:check
