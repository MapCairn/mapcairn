name: CI

on:
  pull_request:
    # `edited` runs the names check again when the title or description changes.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

# A new push cancels the run for the older commit, but a title or description
# edit has a group of its own: it would otherwise cancel the run in progress for
# the same commit. An edit runs every job here again in full. A job that an edit
# should not repeat belongs in a workflow with no `edited` trigger, as
# `sdk-packages.yml` does: skipping it here would report it as passed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ github.event.action == 'edited' && '-edited' || '' }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The names check reads the pull request's commit messages, which
          # needs the base branch's history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
        env:
          # The roadmap check reads issue states and milestones with `gh`, which
          # needs a token even for a public repository. Without one it skips
          # those parts.
          GH_TOKEN: ${{ github.token }}
      - name: Check the pull request text and commit messages for forbidden names
        if: github.event_name == 'pull_request'
        # The title, body and base branch reach the script through the
        # environment, never through the shell script text.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
        # `shell: bash` turns on pipefail, so a failing `git log` fails the step.
        shell: bash
        run: git log --format=%B "origin/$BASE_REF..HEAD" | node scripts/names-check.mjs text
      - name: Check that a breaking API change is marked in the pull request title
        if: github.event_name == 'pull_request'
        # Reads the API reports at the merge base and at HEAD, which needs the
        # full history fetched above. The title, description and base branch
        # reach the script through the environment, never through the shell
        # script text. Release and Dependabot pull requests are skipped inside it.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/apiBreakingCheck.mjs
      - name: Warn when the pull request lowers the quality bar
        if: github.event_name == 'pull_request'
        # Reads `git diff` from the base branch, which needs the full history
        # fetched above, and only warns. The description and base branch reach
        # the script through the environment, never through the shell script
        # text. Release and Dependabot pull requests are skipped inside it.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/qualityBarCheck.mjs
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
      - run: npm run build
      # The documentation site has its own build step, outside the root `build`
      # script, so a fault in it cannot stop the host's production deploy, which
      # runs that script. It fails on a broken link, a page in no sidebar, a
      # policy break or a script over budget (`sites/docs/scripts/verifyBuild.ts`).
      - name: Build the documentation site
        run: npm run build -w @mapcairn/docs
      # The build is up to date here, so this only reads its declarations. It
      # fails when a package's public API changed and its report under
      # `packages/*/api` was not updated, and prints the TSDoc warnings
      # without failing on them.
      - name: Check the API reports
        run: npm run api:check -- --verbose
      # The coverage run above comes before the build, so the tests that read
      # the build output skip there. Run them here, against it. The variable
      # makes inlineScriptsBuild.test.ts fail, not skip, if the output is missing.
      - run: npx --no-install vitest run packages/web/src/workerBundle.test.ts packages/web/src/deployConfig.test.ts packages/web/src/inlineScriptsBuild.test.ts
        env:
          MAPCAIRN_REQUIRE_BUILD_OUTPUT: "1"

  # Its own job, so a registry outage or a package that publishes without a
  # signature cannot fail the required `build` check. Nothing depends on it.
  signatures:
    name: Registry signatures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      # Checks the registry signature of every installed package and the
      # provenance attestation of those that have one.
      - run: npm audit signatures
