version: 2
updates:
  # One entry per ecosystem and directory: GitHub rejects the whole file otherwise, and Dependabot keeps using the last valid copy.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Africa/Johannesburg"
    open-pull-requests-limit: 2
    groups:
      npm-critical:
        patterns:
          - "wrangler"
          - "vite"
          - "react-router"
          - "zod"
      npm:
        patterns:
          - "*"
    ignore:
      # Paraglide 3 compiles to virtual modules that break the web tests; it needs a migration, not a bulk bump.
      - dependency-name: "@inlang/paraglide-js"
        versions: [">=3.0.0"]
  - package-ecosystem: "npm"
    directory: "/data-pipeline"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Africa/Johannesburg"
    open-pull-requests-limit: 2
    groups:
      npm-data-pipeline-critical:
        patterns:
          - "adm-zip"
          - "shapefile"
      npm-data-pipeline:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Africa/Johannesburg"
    groups:
      github-actions:
        patterns:
          - "*"
