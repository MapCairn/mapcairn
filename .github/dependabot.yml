version: 2
updates:
  # One entry per ecosystem and directory: GitHub rejects the whole file otherwise, and Dependabot keeps using the last valid copy.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Johannesburg"
    open-pull-requests-limit: 2
    # Raises the lower bound of a caret range to the version CI tested.
    versioning-strategy: "increase"
    cooldown:
      default-days: 7
    groups:
      # A pattern without `*` matches that exact name, so each package that must
      # move with one of these is named, or matched with `*`, here. A dependency
      # goes into the first group it matches, so these come before the catch-all.
      npm-critical:
        patterns:
          - "cf"
          - "vite"
          - "react-router"
          - "zod"
          - "@react-router/*"
          - "@vitejs/*"
          - "@cloudflare/vite-plugin"
          - "vitest"
          - "@vitest/*"
      # The documentation site's framework and its plugins release together.
      npm-docusaurus:
        patterns:
          - "@docusaurus/*"
      # The API reports change with either of these, so the update that
      # follows them also needs `npm run api:update` (docs/guides/public-api.md).
      npm-api-reports:
        patterns:
          - "@microsoft/api-extractor"
          - "typescript"
      npm:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "12:00"
      timezone: "Africa/Johannesburg"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
