version: 2
updates:
  # Security/crypto-relevant deps get a faster, separate weekly PR: the
  # Cloudflare deploy tool, the SSR framework, the build tool, and the
  # runtime GeoJSON validation boundary.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Africa/Johannesburg"
    groups:
      npm-critical:
        patterns:
          - "*"
    allow:
      - dependency-name: "wrangler"
      - dependency-name: "vite"
      - dependency-name: "react-router"
      - dependency-name: "zod"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Africa/Johannesburg"
    groups:
      npm:
        patterns:
          - "*"
    ignore:
      - dependency-name: "wrangler"
      - dependency-name: "vite"
      - dependency-name: "react-router"
      - dependency-name: "zod"
      # @inlang/paraglide-js@3 compiles to virtual:paraglide modules supplied
      # only by its Vite plugin, which breaks every web test that imports
      # messages. Needs a migration (vitest config, SSR middleware wiring)
      # rather than a bulk bump.
      - dependency-name: "@inlang/paraglide-js"
        versions: [">=3.0.0"]
  # data-pipeline parses zip/shapefile data fetched from external sources
  # (adm-zip, shapefile); kept on the faster critical tier too.
  - package-ecosystem: "npm"
    directory: "/data-pipeline"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Africa/Johannesburg"
    groups:
      npm-data-pipeline-critical:
        patterns:
          - "*"
    allow:
      - dependency-name: "adm-zip"
      - dependency-name: "shapefile"
  - package-ecosystem: "npm"
    directory: "/data-pipeline"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Africa/Johannesburg"
    groups:
      npm-data-pipeline:
        patterns:
          - "*"
    ignore:
      - dependency-name: "adm-zip"
      - dependency-name: "shapefile"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "Africa/Johannesburg"
    groups:
      github-actions:
        patterns:
          - "*"
