    <polygon points="80,430 96,384 150,368 330,376 410,372 436,420 410,452 110,456"/>
    <polygon points="206,350 192,306 230,274 322,258 378,274 396,316 380,352" transform="translate(0 -4)"/>
    <polygon points="166,238 152,208 184,182 290,176 318,200 310,238" transform="translate(20 8)"/>
  </g>
</svg>
