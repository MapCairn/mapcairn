<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>MapCairn</title>
  <!-- Single-colour glyph for Safari's mask-icon. Safari recolours it using the colour in the link tag.
       The stones are drawn a little smaller than in the favicon so thin gaps stay open without a halo. -->
