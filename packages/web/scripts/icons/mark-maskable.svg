<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>MapCairn</title>
  <!-- Full-bleed square for the maskable icon: the platform applies its own mask, so there are no rounded corners and no transparency. The stones are drawn smaller than in favicon.svg (scale 0.9 against 1.1) so they sit well inside the central 80 percent safe circle. -->
  <rect width="512" height="512" fill="#0d70d4"/>
  <g transform="translate(256 256) scale(0.9) translate(-258 -323)" stroke-linejoin="round">
    <g>
      <polygon fill="#0d70d4" stroke="#0d70d4" stroke-width="32" points="80,430 96,384 150,368 330,376 410,372 436,420 410,452 110,456"/>
      <polygon fill="#fff" stroke="#fff" stroke-width="18" points="80,430 96,384 150,368 330,376 410,372 436,420 410,452 110,456"/>
    </g>
    <g>
      <polygon fill="#0d70d4" stroke="#0d70d4" stroke-width="32" points="206,350 192,306 230,274 322,258 378,274 396,316 380,352"/>
      <polygon fill="#fff" stroke="#fff" stroke-width="18" points="206,350 192,306 230,274 322,258 378,274 396,316 380,352"/>
    </g>
    <g transform="translate(20 14)">
      <polygon fill="#0d70d4" stroke="#0d70d4" stroke-width="32" points="166,238 152,208 184,182 290,176 318,200 310,238"/>
      <polygon fill="#fff" stroke="#fff" stroke-width="18" points="166,238 152,208 184,182 290,176 318,200 310,238"/>
    </g>
  </g>
</svg>
