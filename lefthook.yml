pre-commit:
  commands:
    biome:
      run: npx biome check --write --error-on-warnings --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    depcruise:
      run: npm run depcruise
    harmony:
      run: npm run lint:harmony
    licence:
      run: npm run licence
    agents:
      run: npm run agents:check
