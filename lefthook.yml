pre-commit:
  commands:
    biome:
      run: npx biome check --write --error-on-warnings --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    depcruise:
      run: npm run depcruise
    harmony:
      run: npm run lint:harmony
    licence:
      run: npm run licence
    licence-sdk:
      run: npm run licence:sdk
    agents:
      run: npm run agents:check
    names:
      run: npm run names:check
    portability:
      run: npm run portability:check
    publish-guard:
      run: npm run publish:guard

commit-msg:
  commands:
    names:
      run: node scripts/names-check.mjs message {1}
